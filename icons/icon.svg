<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#E67E22" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#1A2436" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- App Rounded Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#24334C" stroke-width="8" />

  <!-- Tricolor Accent Arcs -->
  <path d="M 90 90 A 240 240 0 0 1 422 90" fill="none" stroke="url(#saffronGrad)" stroke-width="14" stroke-linecap="round" />
  <path d="M 90 422 A 240 240 0 0 0 422 422" fill="none" stroke="url(#greenGrad)" stroke-width="14" stroke-linecap="round" />

  <!-- Central Ashoka Chakra Motif -->
  <g transform="translate(256, 256)" stroke="#0A58CA" fill="none">
    <circle r="96" stroke-width="12" />
    <circle r="22" fill="#0A58CA" />
    <!-- 24 Spokes -->
    <g stroke-width="6" stroke-linecap="round">
      <line y1="-96" y2="96" />
      <line x1="-96" x2="96" />
      <line x1="-67.88" y1="-67.88" x2="67.88" y2="67.88" />
      <line x1="-67.88" y1="67.88" x2="67.88" y2="-67.88" />
      <line x1="-88.68" y1="-36.74" x2="88.68" y2="36.74" />
      <line x1="-36.74" y1="-88.68" x2="36.74" y2="88.68" />
      <line x1="-36.74" y1="88.68" x2="36.74" y2="-88.68" />
      <line x1="-88.68" y1="36.74" x2="88.68" y2="-36.74" />
      <line x1="-95.1" y1="-12.5" x2="95.1" y2="12.5" />
      <line x1="-12.5" y1="-95.1" x2="12.5" y2="95.1" />
      <line x1="-12.5" y1="95.1" x2="12.5" y2="-95.1" />
      <line x1="-95.1" y1="12.5" x2="95.1" y2="-12.5" />
    </g>
  </g>

  <!-- Speech bubble left (Saffron) -->
  <path d="M 90 220 C 90 180 120 150 160 150 L 210 150 C 250 150 280 180 280 220 C 280 260 250 290 210 290 L 150 290 L 110 320 L 120 285 C 100 270 90 245 90 220 Z" fill="url(#saffronGrad)" opacity="0.9" />
  <!-- Text inside bubble: "अ" (Devanagari A) -->
  <text x="180" y="240" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="70" fill="#FFFFFF" text-anchor="middle">अ</text>

  <!-- Speech bubble right (Green) -->
  <path d="M 422 292 C 422 332 392 362 352 362 L 302 362 C 262 362 232 332 232 292 C 232 252 262 222 302 222 L 362 222 L 402 192 L 392 227 C 412 242 422 267 422 292 Z" fill="url(#greenGrad)" opacity="0.9" />
  <!-- Text inside bubble: "A" (Latin A) -->
  <text x="330" y="310" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="70" fill="#FFFFFF" text-anchor="middle">A</text>
</svg>
